# HW9 Part 3.1 - labeled cache test set (Clinical Trial Listings, SID4 4833)
#
# The cache is first filled with the 10 seed queries (their answers come from the
# HW8 agents). Then each of the 40 cases is sent to the cache on its own:
#   expected_hit: true   -> a good cache returns the seed's answer
#   expected_hit: false  -> a good cache must NOT return it (the agent must answer)
# Labels were written before any threshold was run and are not edited afterwards;
# a labeling mistake found later is documented in the report instead of changed here.

