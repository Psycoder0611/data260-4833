<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Dashboard | Clinical Trial Listings</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Small custom styling to match the rest of the HW3 interface -->
  <style>
    body {
      background: linear-gradient(135deg, #f5f9fc, #eef5f8);
      min-height: 100vh;
    }

    .navbar {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .dashboard-card {
      border: none;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .badge-soft {
      background-color: #e8f3f5;
      color: #1f6f78;
    }
  </style>
</head>

<body>

  <!-- Navigation bar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

      <!-- Domain-specific application branding -->
      <a class="navbar-brand fw-semibold" href="/">
        Clinical Trial Listings
      </a>

      <div class="navbar-nav">

        <!-- Dashboard is available to the authenticated user -->
        <a class="nav-link active" href="/dashboard">
          Dashboard
        </a>

        <!-- Logout clears the active session -->
        <a class="nav-link" href="/logout">
          Logout
        </a>

      </div>

    </div>

  </nav>

  <!-- Main protected dashboard content -->
  <div class="container py-5">

    <div class="row justify-content-center">

      <div class="col-lg-9">

        <div class="card dashboard-card">

          <div class="card-body p-4 p-md-5">

            <!-- Indicates this page is protected by session authentication -->
            <span class="badge badge-soft rounded-pill mb-3">
              Protected Dashboard
            </span>

            <h2 class="fw-bold mb-3">
              Welcome, {{ user }}!
            </h2>

            <p class="text-muted mb-4">
              You are successfully authenticated and can now access
              the protected Clinical Trial Listings dashboard.
            </p>

            <!--
              The username is read from the active session.
              If there is no valid session, the backend redirects
              the user to the /login page.
            -->

            <div class="row g-3 mb-4">

              <div class="col-md-6">

                <div class="border rounded-3 p-3 h-100">

                  <h5 class="mb-2">
                    Session Status
                  </h5>

                  <p class="mb-0 text-muted">
                    Logged in as
                    <strong class="text-dark">{{ user }}</strong>
                  </p>

                </div>

              </div>

              <div class="col-md-6">

                <div class="border rounded-3 p-3 h-100">

                  <h5 class="mb-2">
                    Application
                  </h5>

                  <p class="mb-0 text-muted">
                    Clinical Trial Listings
                  </p>

                </div>

              </div>

            </div>

            <!-- User actions -->
            <a
              href="/"
              class="btn btn-primary me-2"
            >
              Home
            </a>

            <a
              href="/logout"
              class="btn btn-outline-danger"
            >
              Logout
            </a>

          </div>

        </div>

      </div>

    </div>

  </div>

</body>

</html>
